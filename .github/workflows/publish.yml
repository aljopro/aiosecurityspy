name: Publish

on:
  release:
    types: [published]

jobs:
  publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # required for PyPI trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Verify tag matches project version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          case "$TAG_NAME" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *)
              echo "Refusing to publish: '${TAG_NAME}' is not a vX.Y.Z release tag." >&2
              exit 1
              ;;
          esac
          tag_version="${TAG_NAME#v}"
          project_version="$(uv version --short)"
          if [ "$tag_version" != "$project_version" ]; then
            echo "Version mismatch: git tag '${TAG_NAME}' implies '${tag_version}'," \
                 "but pyproject.toml declares '${project_version}'." >&2
            exit 1
          fi
          echo "Version check passed: ${project_version}"

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy (strict)
        run: uv run mypy --strict src tests

      - name: Pytest
        run: uv run pytest -q

      - name: Build
        run: uv build

      - name: Publish
        run: uv publish --trusted-publishing always --check-url https://pypi.org/simple/aiosecurityspy/
