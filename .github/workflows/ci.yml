name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, type-check, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy (strict)
        run: uv run mypy --strict src tests

      - name: Pytest
        run: uv run pytest -q

      - name: Validate the OpenAPI description
        run: |
          uv run python - <<'PY'
          from openapi_spec_validator import validate
          from openapi_spec_validator.readers import read_from_filename

          spec, _ = read_from_filename("docs/securityspy-openapi.yaml")
          validate(spec)

          # Every operation must state its evidence, or the description quietly
          # decays from "what the server does" into "what we assumed it does".
          allowed = {"live-6.21", "client-source", "research-only"}
          missing = [
              f"{method.upper()} {path}"
              for path, ops in spec["paths"].items()
              for method, op in ops.items()
              if isinstance(op, dict) and op.get("x-verification") not in allowed
          ]
          assert not missing, f"operations missing a valid x-verification: {missing}"
          print(f"OpenAPI description valid; {len(spec['paths'])} paths, all marked")
          PY

      - name: Build distributions
        run: uv build

      - name: Verify the sdist ships the OpenAPI description
        run: |
          set -euo pipefail
          sdist="$(ls dist/*.tar.gz)"
          # `grep -q` exits as soon as it finds a match, closing its end of the
          # pipe early; under `pipefail` that can make `tar` see a broken pipe
          # (SIGPIPE) and report a nonzero "write error" even though the file
          # was found. Capturing the full listing first avoids the race.
          listing="$(tar -tzf "$sdist")"
          grep -q 'docs/securityspy-openapi.yaml' <<< "$listing"
          echo "OpenAPI description present in ${sdist}"

      - name: Verify the wheel ships py.typed
        run: |
          set -euo pipefail
          wheel="$(ls dist/*.whl)"
          # Same early-exit-vs-pipefail hazard as the sdist check above.
          listing="$(unzip -l "$wheel")"
          grep -q 'aiosecurityspy/py.typed' <<< "$listing"
          echo "py.typed present in ${wheel}"

      - name: Import from a bare environment with no Home Assistant
        run: |
          set -euo pipefail
          uv venv --python 3.14 "${RUNNER_TEMP}/bare"
          VIRTUAL_ENV="${RUNNER_TEMP}/bare" uv pip install dist/*.whl
          "${RUNNER_TEMP}/bare/bin/python" - <<'PY'
          import importlib.util

          import aiosecurityspy

          assert importlib.util.find_spec("homeassistant") is None, "Home Assistant is installed"
          print(aiosecurityspy.__version__)
          PY
