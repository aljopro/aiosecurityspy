# SecuritySpy HTTP API — machine-readable description
#
# READ THIS BEFORE GENERATING ANYTHING FROM THIS FILE.
#
# OpenAPI describes a well-behaved REST API. SecuritySpy is not one. This file models the
# portion that fits and marks, loudly, every place where it does not — because those places
# are exactly where this project's bugs have come from. A generator that ignores the `x-`
# annotations below will produce a client that is broken in ways the spec looks like it
# endorses.
#
# What this file deliberately does NOT model:
#   * The `++getpreview` URL. It carries a literal `?` inside the path and a SECOND `?`
#     before `archive`. OpenAPI paths cannot contain `?`. See x-raw-url-template on that
#     operation and DO NOT treat `archive` as an ordinary query parameter.
#   * The `formData` sentinel that must be the FIRST token of every settings POST body.
#     It is a bare token, not a key=value pair, so no requestBody schema can express it.
#   * Checkbox fields, which are keyed by HTML element id and appended AFTER the named
#     fields. Order is significant; OpenAPI has no way to say so.
#   * The WebSocket at /video (binary opcode protocol). Out of OpenAPI's scope entirely.
#   * Non-conforming HTTP: the 403 reason phrase is "OK", and HEAD returns "400 OK".
#     Parse numeric status only.
#
# `x-verification` on each operation states the evidence behind it:
#   live-6.21     — response observed from a running 6.21 server on 2026-08-29
#   client-source — read from the shipped web client in the app bundle, not exercised
#   research-only — from securityspy-api-reference.md, never verified here
#
# Companion prose: _bmad-output/planning-artifacts/research/securityspy-6.21-verification.md

openapi: 3.1.0
info:
  title: SecuritySpy HTTP API (reverse-engineered)
  version: "6.21"
  summary: The subset of SecuritySpy's HTTP surface that aiosecurityspy speaks.
  description: |
    Reverse-engineered from the shipped web client and verified against a live 6.21 server.
    Not a vendor artifact and not exhaustive.

    **The `++` prefix is load-bearing.** Both `/++systemInfo` and `/systemInfo` reach the
    same handler when authenticated, but unauthenticated the `++` form returns `401` with a
    Basic challenge while the bare form returns `303` to the login page. A client using
    Basic auth must always use `++`, or an expired credential surfaces as a redirect.
  license:
    name: Documentation of a third-party API; no vendor affiliation

servers:
  - url: "https://{host}:{port}"
    description: SecuritySpy web server (HTTPS; certificate is typically self-signed)
    variables:
      host: { default: "localhost" }
      port: { default: "8001" }
  - url: "http://{host}:{port}"
    description: Plain HTTP. Basic credentials travel in clear; prefer HTTPS.
    variables:
      host: { default: "localhost" }
      port: { default: "8000" }

security:
  - basicAuth: []

tags:
  - name: inventory
    description: Server and camera inventory.
  - name: captures
    description: The capture list and capture media.
  - name: settings
    description: Settings pages. Reads are JSON; writes are form POSTs with quirks.
  - name: arming
    description: Schedule and override writes.
  - name: streaming
    description: Live and event streams.

paths:
  /++systemInfo:
    get:
      operationId: getSystemInfo
      tags: [inventory]
      summary: Full server configuration, camera inventory, and schedule lists.
      x-verification: live-6.21
      x-quirks:
        - >-
          The camera array is `camera-list` at the TOP LEVEL, not `cameralist.camera`.
          Assuming the latter yields an empty inventory from a healthy server — the defect
          behind story 1.12.
      parameters:
        - $ref: "#/components/parameters/Format"
      responses:
        "200":
          description: Decoded inventory.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemInfo" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /++camStatus:
    get:
      operationId: getCameraStatus
      tags: [inventory]
      summary: Cheap per-camera health poll.
      description: |
        794 bytes for 11 cameras, against ~26 KB for `++systemInfo`. Returns JSON
        unconditionally — `format=json` is not required and is not sent.
      x-verification: live-6.21
      responses:
        "200":
          description: One entry per camera.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CameraStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /++caplist:
    get:
      operationId: getCaptureList
      tags: [captures]
      summary: Captured files, with classification.
      x-verification: live-6.21
      x-quirks:
        - "Returns a bare top-level array."
        - "Without a date range the result is an empty array, not an error."
      parameters:
        - $ref: "#/components/parameters/Format"
        - name: cams
          in: query
          description: Trailing-comma-terminated camera numbers, e.g. `1,4,`.
          schema: { type: string }
        - name: startDate
          in: query
          schema: { type: string, format: date }
        - name: endDate
          in: query
          schema: { type: string, format: date }
        - name: filter
          in: query
          description: Server-side class filter; class-aware.
          schema: { type: integer }
      responses:
        "200":
          description: Captures, newest first is NOT guaranteed by the server.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Capture" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /++getfile/{camera}/{folderDate}/{filename}:
    get:
      operationId: getCaptureFile
      tags: [captures]
      summary: Download a capture at standard bandwidth.
      description: |
        `++getfilehb` and `++getfilelb` are the same operation at high and low bandwidth.
        The served content type is whatever the server sends; do not assume one per variant.
      x-verification: research-only
      x-quirks:
        - >-
          `filename` MUST be percent-encoded. Live filenames contain spaces
          (`08-29-2026 5-52-31 AM M Living Room.mov`); unencoded they break the URL.
      parameters:
        - $ref: "#/components/parameters/CameraPath"
        - $ref: "#/components/parameters/FolderDate"
        - $ref: "#/components/parameters/Filename"
        - name: archive
          in: query
          schema: { type: integer, enum: [0, 1] }
      responses:
        "200":
          description: The recording. Stream it; recordings reach gigabytes.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /++getpreview:
    get:
      operationId: getCapturePreview
      tags: [captures]
      summary: "JPEG thumbnail. ⚠ NON-STANDARD URL — see x-raw-url-template."
      description: |
        **This operation's real URL cannot be expressed in OpenAPI.** The path is followed by
        a literal `?`, then the capture triple, then a SECOND `?` before `archive`. Build the
        URL from `x-raw-url-template` verbatim. Treating `archive` as an ordinary query
        parameter produces a URL the server does not understand.
      x-verification: research-only
      x-raw-url-template: "/++getpreview?/{camera}/{folderDate}/{urlEncodedFilename}?archive={0|1}"
      responses:
        "200":
          description: JPEG thumbnail (~95 KB observed).
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /++settings-cameras:
    get:
      operationId: getCameraSettings
      tags: [settings]
      summary: One camera's settings page as flat JSON.
      description: |
        ⚠ The response contains the camera device's `username` and `password` in plaintext.
        Never log this body, and redact credential-shaped keys before publishing it anywhere.
      x-verification: client-source
      x-quirks:
        - "`cameraNum` is REQUIRED here; omitting it returns HTTP 500."
      parameters:
        - name: cameraNum
          in: query
          required: true
          schema: { type: integer, minimum: 0 }
        - $ref: "#/components/parameters/Format"
      responses:
        "200":
          description: ~120 flat keys.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: setCameraSettings
      tags: [settings]
      summary: "Partial settings write. ⚠ Body format is NOT expressible as a schema."
      description: |
        **Do not generate a client body from the schema below.** Three rules govern this
        request and only the third fits OpenAPI:

        1. The body MUST begin with the bare token `formData` — not a key=value pair.
        2. `cameraNum` travels in the BODY, never the query string. A query form returns 404.
        3. Booleans are written `1`/`0`, though they READ BACK as JSON `true`/`false`.

        Checkbox fields are keyed by HTML element **id** and appended after the named fields.
        `enabled` — the camera enable/disable control — is one of these, which is why it does
        not appear in any list of named settings fields.

        Partial writes are safe: untouched keys among the ~120 on the page retain their
        values, so no read-modify-write is required.
      x-verification: client-source
      x-body-template: "formData&cameraNum={n}&{namedField}={urlEncodedValue}&{checkboxId}={1|0}"
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              description: "Illustrative only — see x-body-template for the real shape."
              properties:
                cameraNum: { type: integer }
                enabled:
                  type: string
                  enum: ["0", "1"]
                  description: Camera enable/disable. Checkbox key, serialised by element id.
      responses:
        "200":
          description: 'Acknowledgement, e.g. `{"camUpdate": ...}` or `{"reload": true}`.'
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /++ssSetSchedule:
    get:
      operationId: setSchedule
      tags: [arming]
      summary: Set a camera's schedule and/or override. A write performed with GET.
      x-verification: client-source
      x-quirks:
        - "A state-changing operation issued as a GET."
        - >-
          `schedule=` reassigns which schedule governs a mode. aiosecurityspy never sends it
          (AD-7): only the transient, bounded `override` is written.
      parameters:
        - name: cameraNum
          in: query
          schema: { type: integer }
        - name: schedule
          in: query
          description: Schedule id. See AD-7 before sending.
          schema: { type: integer }
        - name: override
          in: query
          schema: { type: integer, minimum: 0, maximum: 14 }
        - name: mode
          in: query
          description: Concatenated mode letters, e.g. `CMA`.
          schema: { type: string, pattern: "^[CMA]*$" }
      responses:
        "200": { description: Applied. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /++eventStream:
    get:
      operationId: getEventStream
      tags: [streaming]
      summary: Long-lived event stream.
      description: |
        Records are terminated by **CR (0x0D) only** — the body contains zero LF bytes, and
        the final record is CR-terminated too. A standard readline() never returns. Verified
        live on 6.21: 5 CR, 0 LF, 0 CRLF over a 45 s capture.

        Format: `[TIME] [EVENT_NUMBER] [CAMERA] [EVENT] [INFO]`, e.g.
        `20260829062049 0 X NULL`. `EVENT_NUMBER` is a per-connection counter from 0.
        `CAMERA` is `X` when not camera-specific. A `NULL` heartbeat arrives every 10 s.

        ⚠ `TIME` is the server's **local** wall clock with no offset attached. Convert it
        using `seconds-from-gmt` from `++systemInfo`, never by assuming UTC.

        The response has no `Content-Length` and no chunked encoding; it is close-terminated
        and never ends by design, so no total read deadline applies.
      x-verification: live-6.21
      parameters:
        - name: version
          in: query
          schema: { type: integer, default: 3 }
      responses:
        "200":
          description: CR-framed event records.
          content:
            text/plain:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }

components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: |
        HTTP Basic. The server also accepts session cookies and an `auth` token (used by the
        WebSocket), neither of which this description models.

  parameters:
    Format:
      name: format
      in: query
      required: false
      schema: { type: string, enum: [json, xml] }
      description: JSON key names differ from XML tag names; they are not interchangeable.
    CameraPath:
      name: camera
      in: path
      required: true
      schema: { type: integer }
    FolderDate:
      name: folderDate
      in: path
      required: true
      schema: { type: string, format: date }
    Filename:
      name: filename
      in: path
      required: true
      schema: { type: string }
      description: MUST be percent-encoded; live filenames contain spaces.

  responses:
    Unauthorized:
      description: |
        Credentials are wrong, absent, or for an unknown account. Carries
        `WWW-Authenticate: Basic realm="SecuritySpy"`. Body is the literal `401 Unauthorized`.
      content:
        text/plain:
          schema: { type: string, const: "401 Unauthorized" }
    Forbidden:
      description: |
        Credentials are VALID; the account lacks the required permission. No
        `WWW-Authenticate` header. Body is the literal `403 Access Denied`. Do not treat this
        as an authentication failure — re-prompting for credentials cannot fix it.
        ⚠ The reason phrase on this response is "OK", not "Forbidden". Parse the code only.
      content:
        text/plain:
          schema: { type: string, const: "403 Access Denied" }

  schemas:
    SystemInfo:
      type: object
      description: Six top-level keys. Verified against a live 6.21 server.
      properties:
        server: { $ref: "#/components/schemas/Server" }
        camera-list:
          type: array
          description: ⚠ TOP-LEVEL array. Not nested under `cameralist.camera`.
          items: { $ref: "#/components/schemas/Camera" }
        schedule-list:
          type: array
          items: { $ref: "#/components/schemas/NamedId" }
        schedule-override-list:
          type: array
          description: Ids 0–14. The `-1` "Unchanged" entry is client-only and absent here.
          items: { $ref: "#/components/schemas/NamedId" }
        schedule-preset-list:
          type: array
          description: Empty on every server observed; element shape unverified.
          items: { type: object, additionalProperties: true }
        group-list:
          type: array
          items: { type: object, additionalProperties: true }

    NamedId:
      type: object
      description: An array element, NOT an object keyed by id.
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string }

    Server:
      type: object
      properties:
        uuid:
          type: string
          description: Stable hub identifier. Also returned in the `SS-UUID` response header
            on every response, including 401 and 403.
        version: { type: string, examples: ["6.21"] }
        camera-count: { type: integer }
        cpu-usage: { type: number }
        memory-pressure: { type: number }
        new-version: { type: string }
        seconds-from-gmt:
          type: integer
          description: >-
            Server UTC offset in seconds, e.g. -18000 for UTC-5. REQUIRED to interpret
            event-stream timestamps and capture times, both of which are the server's local
            wall clock with no offset attached.
        current-local-time:
          type: string
          description: Full ISO-8601 local time WITH offset, e.g. `2026-08-29T05:28:00-05:00`.
        current-absolute-time: { type: number }
        time-format: { type: integer, description: "12 or 24; display preference only." }
      additionalProperties: true

    Camera:
      type: object
      description: 72 fields on 6.21. Only those aiosecurityspy decodes are listed.
      properties:
        number: { type: integer, description: Stable key; names are user-editable. }
        name: { type: string }
        connected: { type: boolean }
        permissions:
          type: integer
          description: |
            Bitmask. 1 live video, 4 files, 8 file delete, 16 SET CAMERA SETTINGS,
            64 camera control, 128 schedules, 256 PTZ preset, 512 audio receive,
            1024 trigger, 2048 audio send, 4096 HIDE DOWNLOAD (a DENY bit), 8192 push
            streams. Bit 1 (value 2) is observed set but is undocumented — treat as reserved.
        cc-schedule-id: { type: integer }
        mc-schedule-id: { type: integer }
        a-schedule-id: { type: integer }
        cc-schedule-override: { type: integer }
        mc-schedule-override: { type: integer }
        a-schedule-override: { type: integer }
        cc-mode: { type: string }
        mc-mode: { type: string }
        a-mode: { type: string }
      additionalProperties: true

    CameraStatus:
      type: object
      description: >-
        `enabled`, `online` and `open` are three INDEPENDENT states, never collapsed into one.
      properties:
        num: { type: integer }
        enabled: { type: boolean }
        online: { type: boolean }
        open: { type: boolean }
        err:
          type: integer
          description: 0 when healthy. Observed as an int; non-zero form unverified.
        errDesc: { type: string }

    Capture:
      type: object
      description: Single-letter keys. All thirteen present on every live entry.
      properties:
        c: { type: integer, description: Camera number. }
        t: { type: integer, description: "1 = movie, 2 = JPEG image." }
        s: { type: integer, description: Start time, seconds since midnight of `f`. }
        d: { type: integer, description: Duration in seconds. }
        m:
          type: number
          description: >-
            ⚠ File size in MEGABYTES, as a FLOAT (the client's own parameter is named `mb`).
            Not an integer and not bytes. Observed range 0.04–9129.763.
        f: { type: string, format: date, description: Folder date. }
        n:
          type: string
          description: >-
            Filename. Live values contain SPACES, e.g.
            `08-29-2026 5-52-31 AM M Living Room.mov`. Percent-encode before use in a URL.
        a: { type: integer, description: Archive flag. }
        u: { type: integer, description: Unread/new flag. }
        g: { type: integer, description: User tag id. }
        o: { type: integer, description: "Class bitmask: 1 human, 2 vehicle, 4 animal." }
        i: { type: integer, description: Unconfirmed. }
        z: { type: number, description: Unconfirmed. Does NOT track `m`. }
